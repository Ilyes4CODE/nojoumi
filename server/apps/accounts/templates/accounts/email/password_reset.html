{% comment %}
  The password-reset message.

  **This is not a web page and must not be written like one.** Mail clients are
  roughly the HTML of 1999 with different bugs in each: Outlook renders through
  Word, Gmail strips <style> on some paths, and none of them agree on flexbox,
  grid, or a stylesheet at all. So: tables for layout, inline CSS on every
  element, no class that matters, fixed 600px, and a design that survives with
  every image blocked.

  The illustrations come in as **CID attachments** rather than URLs. A remote
  image is blocked by default in Outlook and proxied by Gmail, so a message whose
  meaning depends on one arrives broken; an attached image always renders. They
  are **PNG** for the same reason — Outlook has no WebP, and the app's artwork is
  all WebP, so the email keeps its own copies.

  If an art file is missing, `mailer.py` leaves out both the attachment and the
  `cid:` reference. The message still reads correctly with nothing but type and
  colour, which is the state it has to be good in anyway.
{% endcomment %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>رمز استعادة كلمة المرور</title>
</head>
<body style="margin:0;padding:0;background:#F8F7FC;">

<!-- The preview line: what the parent reads in the inbox list before opening. -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">
  رمزك هو {{ code }} — صالح لمدة {{ minutes }} دقيقة.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#F8F7FC;padding:24px 12px;">
<tr><td align="center">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
         style="width:600px;max-width:100%;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:#1E2436;">

    <!-- ── header ─────────────────────────────────────────────────── -->
    <tr><td align="center" style="padding:8px 0 22px;">
      {% if art.logo %}<img src="cid:{{ art.logo }}" width="56" height="56" alt=""
           style="display:block;border:0;width:56px;height:56px;">{% endif %}
      <div style="font-size:19px;font-weight:700;color:#5B3FD9;padding-top:8px;letter-spacing:.5px;">Lunio</div>
    </td></tr>

    <!-- ── the card ───────────────────────────────────────────────── -->
    <tr><td style="background:#FFFFFF;border-radius:24px;padding:0 0 34px;">

      <!-- A painted band rather than a background-image: Outlook ignores
           background shorthand on a td, but it fills a solid colour reliably. -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td align="center" style="background:#EDE8FC;border-radius:24px 24px 0 0;padding:30px 24px 26px;">
          {% if art.hero %}<img src="cid:{{ art.hero }}" width="150" height="150" alt=""
               style="display:block;border:0;width:150px;height:150px;">{% endif %}
        </td></tr>
      </table>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="padding:28px 34px 0;" align="right">

          <h1 style="margin:0 0 10px;font-size:23px;font-weight:700;line-height:1.5;color:#1E2436;">
            نسيت كلمة المرور؟ لا مشكلة
          </h1>
          <p style="margin:0 0 22px;font-size:16px;line-height:1.9;color:#5A6178;">
            وصلنا طلب لاستعادة كلمة المرور لحسابك في Lunio. أدخل هذا الرمز في التطبيق
            لتختار كلمة مرور جديدة.
          </p>

          <!-- ── the code ──────────────────────────────────────────── -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr><td align="center"
                    style="background:#F8F7FC;border:2px dashed #C9BCF5;border-radius:18px;padding:22px 12px;">
              <div dir="ltr"
                   style="font-family:'Courier New',Consolas,monospace;font-size:38px;
                          font-weight:700;letter-spacing:10px;color:#5B3FD9;line-height:1.25;">{{ code }}</div>
              <div style="font-size:13px;color:#5A6178;padding-top:8px;">
                صالح لمدة {{ minutes }} دقيقة
              </div>
            </td></tr>
          </table>

          <!-- ── the reassurance ──────────────────────────────────── -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="margin-top:24px;">
            <tr>
              <td width="52" valign="top" style="padding-left:12px;">
                {% if art.shield %}<img src="cid:{{ art.shield }}" width="40" height="40" alt=""
                     style="display:block;border:0;width:40px;height:40px;">{% endif %}
              </td>
              <td valign="top" align="right" style="font-size:14px;line-height:1.85;color:#5A6178;">
                إذا لم تطلب هذا الرمز، تجاهل هذه الرسالة — كلمة مرورك الحالية تبقى كما هي،
                ولا يستطيع أحد تغييرها بدون الرمز.
              </td>
            </tr>
          </table>

          <p style="margin:22px 0 0;font-size:14px;line-height:1.85;color:#5A6178;">
            لن يطلب منك أحد من Lunio هذا الرمز، لا برسالة ولا بمكالمة. اكتبه في التطبيق وحده.
          </p>

        </td></tr>
      </table>
    </td></tr>

    <!-- ── footer ─────────────────────────────────────────────────── -->
    <tr><td align="center" style="padding:22px 24px 6px;font-size:12px;line-height:1.9;color:#8A90A3;">
      أُرسلت هذه الرسالة إلى {{ email }} لأن هذا العنوان مسجَّل في Lunio.<br>
      Lunio — رفيقك في التعلّم
    </td></tr>

  </table>

</td></tr>
</table>
</body>
</html>
