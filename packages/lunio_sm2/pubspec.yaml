name: lunio_sm2
description: >-
  SM-2 spaced repetition scheduling for Lunio. Pure Dart, no Flutter, no clock reads.
  Implements the "نظام مراجعة متباعدة يعيد عرض البطاقات الضعيفة تلقائياً" of Article 2,
  with integer-only arithmetic so intervals can never drift.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  lunio_time:
    path: ../lunio_time

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
