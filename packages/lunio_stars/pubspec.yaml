name: lunio_stars
description: >-
  The Lunio star engine. Pure Dart, no Flutter, no platform access, no clock reads.
  Implements Article 5 (star accounting), Article 6 (earning conditions) and the appendix
  «آلية النجوم ووقت اللعب» so that both can be verified by unit tests alone.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  lunio_time:
    path: ../lunio_time

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
