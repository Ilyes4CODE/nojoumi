name: nojoumi_subscription
description: >-
  Article 7 subscription state machine for Nojoumi. Pure Dart, no Flutter, no network, no clock reads.
  Five states, a signed server snapshot as the only source of truth, a 7-day offline window, and the
  guarantee that blocking and stars never stop — only new AI lesson generation does.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  nojoumi_time:
    path: ../nojoumi_time

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
